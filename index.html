<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minixogos Portela</title>
  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-dark: #121824;
      --card-bg: #1e293b;
      --accent-yellow: #f59e0b;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      padding: 15px;
      background: #0f172a;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: var(--accent-yellow);
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }

    /* Menú Seleccionar Xogo */
    .grid-games {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      margin-top: 10px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .game-card:hover, .game-card:active {
      border-color: var(--accent-yellow);
      transform: translateY(-3px);
    }

    .game-card h3 {
      margin: 8px 0 4px 0;
      font-size: 1.1rem;
    }

    .game-card p {
      margin: 0;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .icon {
      font-size: 2rem;
    }

    /* Area de Xogo */
    #game-stage {
      display: none;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
    }

    .btn-back {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #334155;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .game-title {
      font-size: 1.6rem;
      margin: 10px 0;
      text-align: center;
    }

    .game-desc {
      font-size: 0.85rem;
      color: #cbd5e1;
      text-align: center;
      margin-bottom: 15px;
    }

    /* Comúns a minixogos */
    .board {
      width: 100%;
      height: 280px;
      background: #0f172a;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .btn-main {
      background: var(--accent-yellow);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
    }

    /* Estilos Xogo 1: Reacción */
    .grid-3x3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 80%;
    }

    .circle-btn {
      aspect-ratio: 1;
      background: #334155;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.4);
    }

    .circle-btn.active {
      background: var(--accent-yellow);
      box-shadow: 0 0 20px var(--accent-yellow);
    }

    /* Estilos Xogo 2: Orde Numérica */
    .grid-4x4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 90%;
      height: 90%;
    }

    .num-btn {
      background: var(--accent-blue);
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .num-btn.done {
      visibility: hidden;
    }

    /* Input respostas */
    .input-box {
      width: 100%;
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .input-box input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 1.1rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>MINIXOGOS PORTELA</h1>
  </header>

  <div class="container">

    <!-- MENÚ PRINCIPAL -->
    <div id="game-menu" class="grid-games">
      <div class="game-card" onclick="startReaccion()">
        <div class="icon">⚡</div>
        <h3>Reacción!</h3>
        <p>Reflexos rápidos</p>
      </div>

      <div class="game-card" onclick="startOrde()">
        <div class="icon">🔢</div>
        <h3>Orde Numérica</h3>
        <p>Do 1 ao 16 en orde</p>
      </div>

      <div class="game-card" onclick="startCaixas()">
        <div class="icon">📦</div>
        <h3>Contador Caixas</h3>
        <p>Memoria visual rápida</p>
      </div>

      <div class="game-card" onclick="startTempo()">
        <div class="icon">⏱️</div>
        <h3>Tempo Exacto!</h3>
        <p>Calcula o tempo a cegas</p>
      </div>
    </div>

    <!-- PANTALLA DE XOGO -->
    <div id="game-stage">
      <button class="btn-back" onclick="showMenu()">← Menú</button>
      <h2 id="stage-title" class="game-title">Título</h2>
      <p id="stage-desc" class="game-desc">Instrucións...</p>

      <div id="stage-board" class="board"></div>

      <div id="stage-controls"></div>
    </div>

  </div>

  <script>
    // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDY68e8tDZkcvrLiu2xoaVCDJIY_g1KP0w",
            authDomain: "minixogos-portela.firebaseapp.com",
            projectId: "minixogos-portela",
            storageBucket: "minixogos-portela.appspot.com",
            messagingSenderId: "610062616692",
            appId: "1:610062616692:web:1004d65064538a61dc2921"
        };

    // Inicializar Firebase só se non está inicializado
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // --- EFECTOS DE SON CON WEB AUDIO API ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    // --- CONTROL DE PANTALLAS ---
    const menu = document.getElementById('game-menu');
    const stage = document.getElementById('game-stage');
    const board = document.getElementById('stage-board');
    const title = document.getElementById('stage-title');
    const desc = document.getElementById('stage-desc');
    const controls = document.getElementById('stage-controls');

    function showMenu() {
      stage.style.display = 'none';
      menu.style.display = 'grid';
      board.innerHTML = '';
      controls.innerHTML = '';
    }

    function setupStage(gameTitle, gameDesc) {
      menu.style.display = 'none';
      stage.style.display = 'flex';
      title.innerText = gameTitle;
      desc.innerText = gameDesc;
      board.innerHTML = '';
      controls.innerHTML = '';
    }

    function saveScore(gameName, score) {
      const user = prompt("Xogo rematado! Escribe o teu nome para a clasificación:") || "Anónimo";
      db.ref('puntuacions/' + gameName).push({
        Xogador: user,
        Puntos: score,
        Data: new Date().toISOString()
      });
    }

    // ==========================================
    // 1. MINIXOGO: REACCIÓN!
    // ==========================================
    let reactTimeout, reactStartTime;
    function startReaccion() {
      setupStage('REACCIÓN!', 'Unha cela se iluminará en amarelo. Tócala o máis rápido que poidas!');

      let grid = document.createElement('div');
      grid.className = 'grid-3x3';
      for(let i=0; i<9; i++) {
        let btn = document.createElement('div');
        btn.className = 'circle-btn';
        btn.dataset.id = i;
        btn.onclick = () => handleReactClick(btn);
        grid.appendChild(btn);
      }
      board.appendChild(grid);

      let startBtn = document.createElement('button');
      startBtn.className = 'btn-main';
      startBtn.innerText = 'Comezar!';
      startBtn.onclick = () => prepareReactRound(startBtn);
      controls.appendChild(startBtn);
    }

    function prepareReactRound(btn) {
      btn.style.display = 'none';
      const circles = document.querySelectorAll('.circle-btn');
      circles.forEach(c => c.classList.remove('active'));

      let delay = Math.random() * 2000 + 1000;
      reactTimeout = setTimeout(() => {
        let randIdx = Math.floor(Math.random() * 9);
        circles[randIdx].classList.add('active');
        playBeep(600, 'triangle', 0.15);
        reactStartTime = Date.now();
      }, delay);
    }

    function handleReactClick(btn) {
      if (btn.classList.contains('active')) {
        let time = (Date.now() - reactStartTime) / 1000;
        btn.classList.remove('active');
        playBeep(880, 'sine', 0.2);
        alert(`Tempo de reacción: ${time.toFixed(3)}s`);
        saveScore('Reaccion', time.toFixed(3) + "s");
        showMenu();
      }
    }

    // ==========================================
    // 2. MINIXOGO: ORDE NUMÉRICA
    // ==========================================
    let currentNum = 1;
    let ordeStartTime;
    function startOrde() {
      setupStage('ORDE NUMÉRICA', 'Toca os números do 1 ao 16 en orde crecente o máis rápido posíbel.');
      currentNum = 1;

      let numbers = Array.from({length: 16}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
      let grid = document.createElement('div');
      grid.className = 'grid-4x4';

      numbers.forEach(num => {
        let btn = document.createElement('div');
        btn.className = 'num-btn';
        btn.innerText = num;
        btn.onclick = () => {
          if (num === currentNum) {
            playBeep(400 + (num * 30), 'sine', 0.08);
            btn.classList.add('done');
            currentNum++;
            if (currentNum > 16) {
              let totalTime = ((Date.now() - ordeStartTime) / 1000).toFixed(2);
              playBeep(1000, 'square', 0.3);
              alert(`Conseguido en: ${totalTime} segundos!`);
              saveScore('OrdeNumerica', totalTime + "s");
              showMenu();
            }
          } else {
            playBeep(150, 'sawtooth', 0.2);
          }
        };
        grid.appendChild(btn);
      });

      board.appendChild(grid);
      ordeStartTime = Date.now();
    }

    // ==========================================
    // 3. MINIXOGO: CONTADOR DE CAIXAS
    // ==========================================
    function startCaixas() {
      setupStage('CONTADOR DE CAIXAS', 'Observa as caixas e di cantas vaches antes de que desaparezan.');

      let count = Math.floor(Math.random() * 8) + 4;
      board.innerHTML = '';

      for(let i=0; i<count; i++) {
        let box = document.createElement('div');
        box.style.width = '40px';
        box.style.height = '40px';
        box.style.background = '#f59e0b';
        box.style.borderRadius = '6px';
        box.style.position = 'absolute';
        box.style.top = Math.random() * 200 + 20 + 'px';
        box.style.left = Math.random() * 250 + 20 + 'px';
        box.style.boxShadow = '0 4px 0 #b45309';
        board.appendChild(box);
      }

      setTimeout(() => {
        board.innerHTML = '<h3 style="color:#94a3b8">Cantas caixas había?</h3>';
        let boxInput = document.createElement('div');
        boxInput.className = 'input-box';
        boxInput.innerHTML = `
          <input type="number" id="box-ans" placeholder="Número">
          <button class="btn-main" style="margin:0" onclick="checkCaixas(${count})">Enviar</button>
        `;
        controls.appendChild(boxInput);
      }, 1500);
    }

    function checkCaixas(correct) {
      let val = parseInt(document.getElementById('box-ans').value);
      if (val === correct) {
        playBeep(800, 'sine', 0.2);
        alert('Correcto! Tes boa memoria visual.');
        saveScore('ContadorCaixas', 'Axeitado');
      } else {
        playBeep(200, 'sawtooth', 0.2);
        alert(`Incorrecto! Había ${correct} caixas.`);
      }
      showMenu();
    }

    // ==========================================
    // 4. MINIXOGO: TEMPO EXACTO!
    // ==========================================
    let tempoStart, barElem;
    function startTempo() {
      setupStage('TEMPO EXACTO!', 'Calcula mentalmente cando a barra chegue exactamente a 5 segundos.');

      let barBg = document.createElement('div');
      barBg.style.width = '80%';
      barBg.style.height = '20px';
      barBg.style.background = '#334155';
      barBg.style.borderRadius = '10px';
      barBg.style.overflow = 'hidden';

      barElem = document.createElement('div');
      barElem.style.width = '100%';
      barElem.style.height = '100%';
      barElem.style.background = '#10b981';
      barBg.appendChild(barElem);

      board.appendChild(barBg);

      let btn = document.createElement('button');
      btn.className = 'btn-main';
      btn.innerText = 'COMEZAR / PARAR';
      btn.onclick = () => handleTempoControl(btn);
      controls.appendChild(btn);
    }

    let isTempoRunning = false;
    function handleTempoControl(btn) {
      if (!isTempoRunning) {
        isTempoRunning = true;
        tempoStart = Date.now();
        barElem.style.transition = 'width 5s linear';
        barElem.style.width = '0%';

        // Ocultar a barra a partir dos 2.5 segundos
        setTimeout(() => {
          if (isTempoRunning) barElem.style.opacity = '0';
        }, 2500);
      } else {
        let elapsed = (Date.now() - tempoStart) / 1000;
        let diff = Math.abs(5.0 - elapsed).toFixed(2);
        playBeep(600, 'sine', 0.2);
        alert(`Paraches en ${elapsed.toFixed(2)}s! Diferenza: ${diff}s`);
        saveScore('TempoExacto', diff + "s erro");
        isTempoRunning = false;
        showMenu();
      }
    }
  </script>
</body>
</html>
