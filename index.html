<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Xogos e Adestramento</title>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #2c3e50;
            --accent: #e74c3c;
            --success: #2ecc71;
            --bg: #f4f7f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background: var(--secondary); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        #header-usuario { font-weight: bold; background: rgba(255,255,255,0.2); padding: 0.3rem 0.8rem; border-radius: 15px; display: none; }

        main { flex: 1; max-width: 900px; width: 100%; margin: 1rem auto; padding: 1rem; }
        .pantalla { display: none; background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .pantalla.activa { display: block; }

        button { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 5px; cursor: pointer; font-size: 1rem; transition: background 0.2s; margin: 0.2rem; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: var(--accent); }
        .btn-success { background: var(--success); }

        .grid-xogos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .card-xogo { border: 2px solid #ddd; border-radius: 8px; padding: 1rem; text-align: center; cursor: pointer; transition: transform 0.2s; }
        .card-xogo:hover { transform: translateY(-3px); border-color: var(--primary); }

        /* Estilos específicos dos xogos e correccións */
        .dados-instrucións { font-size: 0.85rem; line-height: 1.2; color: #666; margin-bottom: 0.5rem; }
        
        /* Barriña de precisión */
        .barra-container { width: 100%; height: 40px; background: #eee; position: relative; border-radius: 5px; overflow: hidden; margin: 1rem 0; }
        .barra-precision { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4d4d 0% 35%, #ffcc00 35% 45%, #4caf50 45% 55%, #ffcc00 55% 65%, #ff4d4d 65% 100%); }
        .indicador-barra { position: absolute; top: 0; width: 6px; height: 100%; background: black; left: 0%; }
        .btn-accion-barrina { width: 100%; padding: 15px; font-size: 1.2rem; margin-top: 15px; background: var(--secondary); }

        /* Canvas areas */
        canvas { border: 2px solid #333; background: #fff; display: block; margin: 0 auto; max-width: 100%; }
        
        /* Area de xogo interactiva */
        .game-area { width: 100%; height: 350px; position: relative; overflow: hidden; background: #f0f0f0; border-radius: 8px; border: 1px solid #ccc; }
        .target-fly { position: absolute; width: 40px; height: 40px; background: red; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1 style="font-size:1.3rem; cursor:pointer;" onclick="mostrarPantalla('menu-principal')">🎮 Adestramento do Cerebro</h1>
        <div>
            <span id="header-usuario"></span>
            <button onclick="mostrarMenuBorrado()" class="btn-danger" style="font-size:0.8rem; margin-left:10px;">🗑️ EasterEgg</button>
        </div>
    </header>

    <main>
        <!-- LOGIN -->
        <section id="pantalla-login" class="pantalla activa">
            <h2>Iniciar Sesión</h2>
            <br>
            <input type="text" id="input-usuario" placeholder="Nome de usuario" style="padding:0.5rem; width:100%; margin-bottom:1rem;">
            <button onclick="iniciarSesion()">Entrar</button>
        </section>

        <!-- MENÚ PRINCIPAL -->
        <section id="pantalla-menu-principal" class="pantalla">
            <h2>Modos de Xogo</h2>
            <div style="margin: 1rem 0;">
                <button onclick="iniciarModo('campana')">🏆 Campaña</button>
                <button onclick="iniciarModo('desafioDia')">📅 Desafío do Día</button>
                <button onclick="iniciarModo('contrareloxo')">⏱️ Contrareloxo</button>
                <button onclick="iniciarModo('libre')">🎮 Xogo Libre</button>
            </div>
            
            <hr><br>
            <h3>Código de Club</h3>
            <div style="display:flex; gap:10px; align-items:center; margin-top:0.5rem;">
                <input type="text" id="input-club" value="CLUB-2026-XOGOS" readonly style="padding:0.5rem; flex:1;">
                <button id="btn-copiar-club" onclick="copiarCodigoClub()">Copiar Código</button>
            </div>

            <br><hr><br>
            <h3>Tódolos Xogos (14)</h3>
            <div class="grid-xogos" id="grid-xogos-libres"></div>
        </section>

        <!-- ÁREA DE XOGO -->
        <section id="pantalla-xogo" class="pantalla">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h3 id="xogo-titulo">Xogo</h3>
                <div>
                    <span id="xogo-info-modo" style="font-weight:bold; margin-right:15px;"></span>
                    <button onclick="abandonarXogo()" class="btn-danger">Abandonar</button>
                </div>
            </div>
            <div id="xogo-contenedor"></div>
        </section>
    </main>

    <script>
        // ESTADO DA APLICACIÓN
        let usuarioActual = null;
        let modoXogo = 'libre'; // libre, campana, desafioDia, contrareloxo
        let roldaActual = 1;
        let totalRoldasCampana = 5;
        let tempoRestanteContrareloxo = 0;
        let timerContrareloxo = null;
        let xogoActualId = null;

        // LISTA DOS 14 XOGOS
        const XOGOS = [
            { id: 'dados', nome: 'Suma de Dados' },
            { id: 'intruso', nome: 'O Obxecto Intruso' },
            { id: 'precision', nome: 'Precisión da Barriña' },
            { id: 'labirinto', nome: 'Labirinto Táctil' },
            { id: 'caza_moscas', nome: 'Caza de Moscas' },
            { id: 'sombras', nome: 'Memoria de Sombras' },
            { id: 'metro', nome: 'Corredor do Metro' },
            { id: 'tiro', nome: 'Tiro ao Blanco Móbil' },
            { id: 'memoria_cartas', nome: 'Memoria de Cartas' },
            { id: 'calculo', nome: 'Cálculo Rápido' },
            { id: 'clics', nome: 'Clics Rápidos' },
            { id: 'stroop', nome: 'Stroop de Cores' },
            { id: 'secuencia', nome: 'Secuencia Visual' },
            { id: 'anagrama', nome: 'Anagrama' }
        ];

        // INICIALIZACIÓN
        function actualizarHeaderUsuario() {
            const elUsuario = document.getElementById("header-usuario");
            if (!usuarioActual) {
                elUsuario.textContent = "";
                elUsuario.style.display = "none";
            } else {
                elUsuario.textContent = usuarioActual;
                elUsuario.style.display = "inline-block";
            }
        }

        function mostrarPantalla(id) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.getElementById(`pantalla-${id}`).classList.add('activa');
        }

        function iniciarSesion() {
            const nome = document.getElementById('input-usuario').value.trim();
            if (nome) {
                usuarioActual = nome;
                actualizarHeaderUsuario();
                renderizarGridXogos();
                mostrarPantalla('menu-principal');
            }
        }

        function copiarCodigoClub() {
            const input = document.getElementById("input-club");
            navigator.clipboard.writeText(input.value).then(() => {
                const btn = document.getElementById("btn-copiar-club");
                btn.textContent = "¡Copiado!";
                setTimeout(() => btn.textContent = "Copiar Código", 2000);
            });
        }

        // EASTER EGG DE BORRADO
        function mostrarMenuBorrado() {
            let opcion = "";
            while (opcion !== "4") {
                opcion = prompt(
                    "--- MENÚ DE BORRADO EXTREMO ---\n\n" +
                    "1. Borrar Historial de Partidas: Elimina os rexistros de vitorias e derrotas.\n" +
                    "2. Resetear Récords e Puntuacións: Pon a cero as marcas de tódolos xogos.\n" +
                    "3. Eliminar Datos do Club: Borra a vinculación do club actual.\n" +
                    "4. Saír (Ir á páxina inicial de Login)\n\n" +
                    "Escolle unha opción (1-4):"
                );

                switch (opcion) {
                    case "1":
                        localStorage.removeItem("historialPartidas");
                        alert("Historial eliminado.");
                        break;
                    case "2":
                        localStorage.removeItem("recordsUsuario");
                        alert("Récords reseteados.");
                        break;
                    case "3":
                        localStorage.removeItem("datosClub");
                        alert("Datos do club borrados.");
                        break;
                    case "4":
                        usuarioActual = null;
                        actualizarHeaderUsuario();
                        mostrarPantalla('login');
                        return;
                    default:
                        if (opcion !== null) alert("Opción non válida.");
                        break;
                }
            }
        }

        // XESTIÓN DE MODOS DE XOGO
        function renderizarGridXogos() {
            const container = document.getElementById('grid-xogos-libres');
            container.innerHTML = '';
            XOGOS.forEach(x => {
                const card = document.createElement('div');
                card.className = 'card-xogo';
                card.innerHTML = `<h4>${x.nome}</h4>`;
                card.onclick = () => cargarXogo(x.id, 'libre');
                container.appendChild(card);
            });
        }

        function iniciarModo(modo) {
            modoXogo = modo;
            roldaActual = 1;
            clearInterval(timerContrareloxo);

            if (modo === 'contrareloxo') {
                tempoRestanteContrareloxo = 60;
                timerContrareloxo = setInterval(() => {
                    tempoRestanteContrareloxo--;
                    if (tempoRestanteContrareloxo <= 0) {
                        clearInterval(timerContrareloxo);
                        alert("¡Tempo esgotado no modo Contrareloxo!");
                        mostrarPantalla('menu-principal');
                    } else {
                        const el = document.getElementById('xogo-info-modo');
                        if (el) el.textContent = `⏱️ Tempo: ${tempoRestanteContrareloxo}s`;
                    }
                }, 1000);
                cargarXogoAleatorio();
            } else if (modo === 'desafioDia' || modo === 'campana') {
                cargarSeguinteRolda();
            }
        }

        function cargarSeguinteRolda() {
            const maxRoldas = (modoXogo === 'desafioDia') ? 3 : totalRoldasCampana;
            if (roldaActual <= maxRoldas) {
                cargarXogoAleatorio();
            } else {
                alert(`¡Parabéns! Completaches o modo ${modoXogo === 'desafioDia' ? 'Desafío do Día' : 'Campaña'}.`);
                mostrarPantalla('menu-principal');
            }
        }

        function cargarXogoAleatorio() {
            const azar = XOGOS[Math.floor(Math.random() * XOGOS.length)].id;
            cargarXogo(azar, modoXogo);
        }

        function aoFinalizarXogo(vitoria) {
            if (modoXogo === 'contrareloxo') {
                if (tempoRestanteContrareloxo > 0) cargarXogoAleatorio();
            } else if (modoXogo === 'desafioDia' || modoXogo === 'campana') {
                roldaActual++;
                cargarSeguinteRolda();
            } else {
                alert(vitoria ? "¡Rolda completada con éxito!" : "Fin do xogo.");
                mostrarPantalla('menu-principal');
            }
        }

        function abandonarXogo() {
            clearInterval(timerContrareloxo);
            mostrarPantalla('menu-principal');
        }

        function cargarXogo(id, modo) {
            xogoActualId = id;
            mostrarPantalla('xogo');
            const info = document.getElementById('xogo-info-modo');
            
            if (modo === 'libre') info.textContent = "Modo Libre";
            else if (modo === 'contrareloxo') info.textContent = `⏱️ Tempo: ${tempoRestanteContrareloxo}s`;
            else info.textContent = `Rolda ${roldaActual} de ${(modo==='desafioDia'?3:totalRoldasCampana)}`;

            const config = XOGOS.find(x => x.id === id);
            document.getElementById('xogo-titulo').textContent = config ? config.nome : 'Xogo';

            const c = document.getElementById('xogo-contenedor');
            c.innerHTML = '';

            // Cargar lóxica do xogo correspondente
            switch(id) {
                case 'dados': initDados(c); break;
                case 'intruso': initIntruso(c); break;
                case 'precision': initPrecision(c); break;
                case 'labirinto': initLabirinto(c); break;
                case 'caza_moscas': initCazaMoscas(c); break;
                case 'sombras': initSombras(c); break;
                case 'metro': initMetro(c); break;
                case 'tiro': initTiro(c); break;
                default: initXogoXenerico(c, id); break;
            }
        }

        // ==========================================
        // IMPLEMENTACIÓN DOS XOGOS
        // ==========================================

        // 1. DADOS (Texto pequeno fix)
        function initDados(c) {
            const num1 = Math.floor(Math.random() * 6) + 1;
            const num2 = Math.floor(Math.random() * 6) + 1;
            const suma = num1 + num2;
            c.innerHTML = `
                <div class="dados-instrucións">Suma total dos puntos amosados nos dados para pasar a seguinte rolda.</div>
                <h1 style="font-size:3rem; text-align:center; margin:1rem;">🎲 ${num1} + 🎲 ${num2}</h1>
                <input type="number" id="ans-dados" style="font-size:1.5rem; width:100%; text-align:center;">
                <button onclick="valDados(${suma})" style="width:100%; margin-top:10px;">Comprobar</button>
            `;
        }
        function valDados(correct) {
            const val = parseInt(document.getElementById('ans-dados').value);
            aoFinalizarXogo(val === correct);
        }

        // 2. O OBXECTO INTRUSO (5 Roldas e maior dificultade)
        function initIntruso(c) {
            let subRolda = 1;
            function renderSubRolda() {
                c.innerHTML = `<h4>Rolda Intruso ${subRolda}/5</h4><p>Atopa a figura diferente:</p><div id="intruso-grid" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;"></div>`;
                const grid = document.getElementById('intruso-grid');
                const totalElem = 5 + (subRolda * 3);
                const normalIcon = "🍎";
                const intrusoIcon = "🍏";
                const intrusoPos = Math.floor(Math.random() * totalElem);

                for(let i=0; i<totalElem; i++) {
                    const btn = document.createElement('button');
                    btn.style.fontSize = "1.8rem";
                    btn.textContent = (i === intrusoPos) ? intrusoIcon : normalIcon;
                    btn.onclick = () => {
                        if (i === intrusoPos) {
                            if (subRolda < 5) { subRolda++; renderSubRolda(); }
                            else { aoFinalizarXogo(true); }
                        } else {
                            aoFinalizarXogo(false);
                        }
                    };
                    grid.appendChild(btn);
                }
            }
            renderSubRolda();
        }

        // 3. PRECISIÓN DA BARRIÑA (Botón grande accesible e saltos de cor)
        function initPrecision(c) {
            c.innerHTML = `
                <p>Preme no botón cando a barra estea na zona verde central:</p>
                <div class="barra-container">
                    <div class="barra-precision"></div>
                    <div id="ind-bar" class="indicador-barra"></div>
                </div>
                <button class="btn-accion-barrina" onclick="detenerBarra()">PARAR AGORA</button>
            `;
            let pos = 0;
            let dir = 2;
            const ind = document.getElementById('ind-bar');
            const interval = setInterval(() => {
                pos += dir;
                if (pos >= 100 || pos <= 0) dir *= -1;
                if (ind) ind.style.left = pos + '%';
            }, 20);

            window.detenerBarra = () => {
                clearInterval(interval);
                const exito = (pos >= 45 && pos <= 55);
                aoFinalizarXogo(exito);
            };
        }

        // 4. LABIRINTO TÁCTIL (Arrastrar sen tocar bordos vermellos)
        function initLabirinto(c) {
            c.innerHTML = `<p>Arrastra o círculo azul ata a meta verde sen tocar as paredes vermellas:</p>
            <canvas id="cv-lab" width="300" height="300"></canvas>`;
            const cv = document.getElementById('cv-lab');
            const ctx = cv.getContext('2d');
            let arrastrando = false;

            function debuxar() {
                ctx.fillStyle = "red"; ctx.fillRect(0,0,300,300);
                ctx.fillStyle = "white"; ctx.fillRect(40,40,220,220); // Camiño seguro
                ctx.fillStyle = "green"; ctx.fillRect(200,200,50,50); // Meta
                ctx.fillStyle = "blue"; ctx.beginPath(); ctx.arc(60,60,15,0,Math.PI*2); ctx.fill(); // Inicio
            }
            debuxar();

            function checkPos(e) {
                const rect = cv.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                
                if (x < 40 || x > 260 || y < 40 || y > 260) {
                    arrastrando = false;
                    alert("¡Tocaches o bordo vermello!");
                    aoFinalizarXogo(false);
                } else if (x >= 200 && y >= 200) {
                    arrastrando = false;
                    aoFinalizarXogo(true);
                }
            }

            cv.onmousedown = cv.ontouchstart = () => { arrastrando = true; };
            cv.onmousemove = cv.ontouchmove = (e) => { if(arrastrando) checkPos(e); };
            cv.onmouseup = cv.ontouchend = () => { arrastrando = false; };
        }

        // 5. CAZA DE MOSCAS (5 obxectos)
        function initCazaMoscas(c) {
            c.innerHTML = `<p>Preme en 5 obxectos antes de que se movan/desaparezan!</p>
            <div class="game-area" id="area-moscas"></div>`;
            const area = document.getElementById('area-moscas');
            let cazadas = 0;

            function xenerarMosca() {
                if (cazadas >= 5) {
                    aoFinalizarXogo(true);
                    return;
                }
                area.innerHTML = '';
                const m = document.createElement('div');
                m.className = 'target-fly';
                m.style.top = Math.random() * 280 + 'px';
                m.style.left = Math.random() * 280 + 'px';
                
                const timeout = setTimeout(() => {
                    aoFinalizarXogo(false); // Esgotouse o tempo sen premela
                }, 1500);

                m.onclick = () => {
                    clearTimeout(timeout);
                    cazadas++;
                    xenerarMosca();
                };
                area.appendChild(m);
            }
            xenerarMosca();
        }

        // 6. MEMORIA DE SOMBRAS
        function initSombras(c) {
            const opcions = [
                { id: 'cán', icon: '🐶' },
                { id: 'gato', icon: '🐱' },
                { id: 'coche', icon: '🚗' },
                { id: 'avión', icon: '✈️' }
            ];
            const correcto = opcions[Math.floor(Math.random()*opcions.length)];

            c.innerHTML = `
                <p>Identifica a que obxecto pertence a sombra:</p>
                <div style="font-size:5rem; text-align:center; filter: brightness(0); margin:1rem;">${correcto.icon}</div>
                <div style="display:flex; justify-content:center; gap:10px;">
                    ${opcions.map(o => `<button onclick="aoFinalizarXogo('${o.id}' === '${correcto.id}')" style="font-size:1.5rem;">${o.icon}</button>`).join('')}
                </div>
            `;
        }

        // 7. CORREDOR DO METRO (3 pistas)
        function initMetro(c) {
            c.innerHTML = `
                <p>Usa os botóns para cambiar de pista e esquivar os obstáculos (❌):</p>
                <div class="game-area" id="metro-area" style="display:flex;">
                    <div id="pista-0" style="flex:1; border-right:1px dashed #ccc; position:relative;"></div>
                    <div id="pista-1" style="flex:1; border-right:1px dashed #ccc; position:relative;"></div>
                    <div id="pista-2" style="flex:1; position:relative;"></div>
                </div>
                <div style="text-align:center; margin-top:10px;">
                    <button onclick="moverMetro(-1)">⬅️ Esquerda</button>
                    <button onclick="moverMetro(1)">Dereita ➡️</button>
                </div>
            `;
            let carrilPlayer = 1;
            let esquivados = 0;

            function renderPlayer() {
                for(let i=0; i<3; i++) {
                    const p = document.getElementById(`pista-${i}`);
                    p.innerHTML = (i === carrilPlayer) ? '<div style="position:absolute; bottom:10px; left:35%; font-size:2rem;">🏃</div>' : '';
                }
            }
            renderPlayer();

            window.moverMetro = (dir) => {
                carrilPlayer = Math.max(0, Math.min(2, carrilPlayer + dir));
                renderPlayer();
            };

            const interval = setInterval(() => {
                const obsCarril = Math.floor(Math.random()*3);
                if (obsCarril === carrilPlayer) {
                    clearInterval(interval);
                    aoFinalizarXogo(false);
                } else {
                    esquivados++;
                    if (esquivados >= 5) {
                        clearInterval(interval);
                        aoFinalizarXogo(true);
                    }
                }
            }, 1000);
        }

        // 8. TIRO AO BLANCO MÓBIL
        function initTiro(c) {
            c.innerHTML = `
                <p>Preme no botón "DISPARAR" cando o centro do obxectivo pase pola mira central (+):</p>
                <div class="game-area" style="position:relative;">
                    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:3rem; pointer-events:none; color:blue;">┼</div>
                    <div id="target-tiro" style="position:absolute; font-size:2rem;">🎯</div>
                </div>
                <button onclick="dispararTiro()" style="width:100%; margin-top:10px;">DISPARAR</button>
            `;
            let posX = 0;
            const target = document.getElementById('target-tiro');
            const loop = setInterval(() => {
                posX = (posX + 5) % 300;
                if (target) target.style.left = posX + 'px';
                if (target) target.style.top = (120 + Math.sin(posX/20)*80) + 'px';
            }, 30);

            window.dispararTiro = () => {
                clearInterval(loop);
                // Centro aprox 130-170
                const exito = (posX >= 120 && posX <= 180);
                aoFinalizarXogo(exito);
            };
        }

        // 9-14. XOGOS XENÉRICOS/RESTANTES DE RECHEO
        function initXogoXenerico(c, id) {
            c.innerHTML = `
                <p>Demostración rápida de resolución para ${id}:</p>
                <button onclick="aoFinalizarXogo(true)" class="btn-success">Completar e Avanzar</button>
            `;
        }

        // Inicializar Estado
        actualizarHeaderUsuario();
    </script>
</body>
</html>
