<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Multixogo - 18 Minixogos</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-inner: #0b1120;
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-dark); color: var(--text); padding: 15px; max-width: 900px; margin: 0 auto; line-height: 1.5; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .btn-secondary { background: #475569; }

        #game-header { text-align: center; margin-bottom: 15px; }
        .campaign-badge { background: var(--warning); color: #000; padding: 4px 10px; border-radius: 6px; font-weight: bold; display: inline-block; font-size: 0.85rem; }
        
        .club-code-box { background: var(--card-inner); padding: 15px; border-radius: 8px; text-align: center; margin-top: 10px; border: 1px solid #1e293b; }
        .code-display { font-size: 1.3rem; font-weight: bold; letter-spacing: 2px; color: var(--accent); margin-bottom: 8px; }

        details { background: var(--card-inner); border-radius: 8px; margin-bottom: 10px; padding: 12px; border: 1px solid #334155; }
        summary { font-weight: bold; cursor: pointer; color: var(--accent); user-select: none; }

        .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
        .badge-card { background: var(--card-inner); padding: 12px 8px; border-radius: 8px; border: 1px solid #334155; text-align: center; font-size: 0.8rem; }
        .badge-icon { font-size: 1.8rem; display: block; margin-bottom: 4px; }
        .badge-locked { filter: grayscale(1); opacity: 0.35; }

        #game-stage { background: #000; border-radius: 10px; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 1px solid #334155; user-select: none; padding: 10px; }
        canvas { background: #000; display: block; max-width: 100%; }

        .target-circle { width: 70px; height: 70px; border-radius: 50%; background: var(--success); cursor: pointer; box-shadow: 0 0 15px var(--success); }
        .choice-btns { display: flex; gap: 10px; width: 100%; margin-top: 15px; flex-wrap: wrap; }
        .choice-btn { flex: 1; min-width: 80px; padding: 15px; font-size: 1.2rem; }
        
        .neon-timer { font-size: 3.5rem; color: #00f0ff; text-shadow: 0 0 12px #00f0ff; font-family: monospace; font-weight: bold; }
        .shot-mark { position: absolute; width: 10px; height: 10px; background: red; border-radius: 50%; border: 1.5px solid white; transform: translate(-50%, -50%); pointer-events: none; }
        
        .num-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 80%; max-width: 300px; }
        .num-btn { background: #1e293b; color: white; border: 2px solid var(--accent); padding: 15px; font-size: 1.4rem; border-radius: 8px; cursor: pointer; text-align: center; font-weight: bold; }

        .shadow-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 10px; }
        .shadow-option { background: #1e293b; padding: 10px; border-radius: 8px; border: 2px solid #334155; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

    <div id="main-menu">
        <div class="card" style="border: 2px solid var(--accent);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>💡 Suxerencia do día</h3>
                <span style="font-size: 0.8rem; background: var(--accent); padding: 2px 8px; border-radius: 4px;">Aleatorio</span>
            </div>
            <p id="daily-game-title" style="margin: 10px 0; font-size: 1.25rem; font-weight: bold; color: #60a5fa;"></p>
            <button class="btn btn-success" onclick="playDailyGame()">Xogar á Suxerencia</button>
            <button class="btn btn-secondary" style="margin-top:5px;" onclick="startCampaign()">🚀 Xogar Modo Campaña (5 Probas Aleatórias)</button>
        </div>

        <div class="card">
            <h3>🎮 Todos os Minixogos (18)</h3>
            <details style="margin-top: 12px;">
                <summary>Desplegar Lista Completa de Xogos</summary>
                <div id="games-list" style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;"></div>
            </details>
        </div>

        <div class="card">
            <h3>🛡️ O Meu Club</h3>
            <input type="text" id="club-name-input" placeholder="Nome do club..." style="width:100%; padding: 10px; margin-top: 10px; border-radius:6px; border: 1px solid #334155; background: #0f172a; color: white;">
            <button class="btn" onclick="saveClub()">Gardar / Crear Club</button>
            <div class="club-code-box">
                <div class="code-display" id="club-code-text">Cod: Q0HFRI</div>
                <button class="btn btn-secondary" style="width: auto; padding: 6px 16px; font-size: 0.85rem;" onclick="copyClubCode()">Copiar Código</button>
            </div>
        </div>

        <div class="card">
            <h3>👤 O Meu Perfil</h3>
            <div style="margin-top: 10px; font-size: 1.1rem;">
                <strong>Mellor Marca Campaña:</strong> <span id="profile-best-score" style="color: var(--success); font-weight: bold;">0</span> pts
            </div>
            <h4 style="margin-top: 18px;">Insignias e Logros (<span id="unlocked-count">0</span>/12)</h4>
            <div class="badge-grid" id="badge-container"></div>
        </div>
    </div>

    <div id="game-screen" style="display: none;">
        <button class="btn btn-secondary" style="width: auto; margin-bottom: 12px;" onclick="exitToMenu()">🏠 Menú (Abandonar)</button>
        <div class="card">
            <div id="game-header">
                <div id="campaign-indicator" class="campaign-badge" style="display: none;"></div>
                <h2 id="game-title" style="margin-top: 2px;"></h2>
                <p id="game-desc" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;"></p>
            </div>
            <div id="game-stage"></div>
            <div id="game-controls" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        let state = {
            isCampaign: false,
            campaignStep: 0,
            campaignGamesQueue: [],
            campaignTotalScore: 0,
            clubName: '',
            clubCode: 'Q0HFRI',
            bestCampaignScore: 0,
            badges: [
                { id: 'vitoria', title: 'Primeira Vitoria', icon: '🏆', unlocked: true, desc: 'Completa un xogo' },
                { id: 'veterano', title: 'Veterano', icon: '🎖️', unlocked: false, desc: 'Termina unha campaña' },
                { id: 'francotirador', title: 'Francotirador', icon: '🎯', unlocked: false, desc: 'Perfecto en Tiro ao Blanco' },
                { id: 'mestre_tempo', title: 'Mestre do Tempo', icon: '⏱️', unlocked: false, desc: 'Diferenza menor a 0.1s' },
                { id: 'coleccionista', title: 'Socio de Club', icon: '🛡️', unlocked: false, desc: 'Crea ou únete a un club' },
                { id: 'rapido', title: 'Lóstrego', icon: '⚡', unlocked: false, desc: 'Reacción menor a 250ms' },
                { id: 'memoria_pro', title: 'Mente de Azoe', icon: '🧠', unlocked: false, desc: 'Supera Memoria Revertida' },
                { id: 'labirinto_master', title: 'Navegante', icon: '🧩', unlocked: false, desc: 'Completa o Labirinto' },
                { id: 'matematico', title: 'Calculadora', icon: '🎲', unlocked: false, desc: 'Suma sen falos' },
                { id: 'cazador', title: 'Cazador Experto', icon: '🪰', unlocked: false, desc: 'Limpa as moscas' },
                { id: 'sombras_pro', title: 'Urbano', icon: '🚇', unlocked: false, desc: 'Supera o Metro' },
                { id: 'perfeccionista', title: 'Perfección', icon: '🌟', unlocked: false, desc: '4000+ pts na campaña' }
            ]
        };

        const GAMES = [
            { id: 'reaccion', name: '1. Reacción e Velocidade', desc: 'Preme o círculo verde axiña que apareza.' },
            { id: 'tempo', name: '2. Tempo Exacto!', desc: 'Para o cronómetro exactamente en 5.00 segundos.' },
            { id: 'dados', name: '3. Suma de Dados', desc: 'Suma os dados e escolle a resposta correcta.' },
            { id: 'tiro', name: '4. Tiro ao Blanco', desc: 'Dispara ao obxectivo móbil.' },
            { id: 'caixas', name: '5. Contador de Caixas', desc: 'Conta cantas caixas hai na pantalla.' },
            { id: 'memoria', name: '6. Memoria Revertida', desc: 'Repite a secuencia de cores en orde inversa.' },
            { id: 'orde', name: '7. Orde Numérica', desc: 'Preme os números en orde ascendente.' },
            { id: 'labirinto', name: '8. Labirinto Táctil', desc: 'Arrastra dende Inicio ata Meta sen saírte.' },
            { id: 'moscas', name: '9. Caza de Moscas', desc: 'Atrapa as formas aleatorias antes de que se movan.' },
            { id: 'sombras', name: '10. Memoria de Sombras', desc: 'Atopa a sombra correcta entre as opcións.' },
            { id: 'metro', name: '11. Corredor do Metro', desc: 'Esquiva obstáculos e colle moedas.' },
            { id: 'stroop', name: '12. Efecto Stroop', desc: 'Indica a COR do texto, non o que pon escrito.' },
            { id: 'parellas', name: '13. Parellas de Cartas', desc: 'Atopa todos os pares de emoji ocultos.' },
            { id: 'simon', name: '14. Secuencia Simón', desc: 'Memoriza e repite o patrón de luces.' },
            { id: 'matematica', name: '15. Operacións Rápidas', desc: 'Resolve a ecuación matemática rápida.' },
            { id: 'par_impar', name: '16. Par ou Impar', desc: 'Determina se o número amosado é par ou impar.' },
            { id: 'esquiva', name: '17. Salto de Obstáculos', desc: 'Preme para saltar sobre a barreira que se achega.' },
            { id: 'balanza', name: '18. Balanza de Pesos', desc: 'Identifica cal dos dous lados é máis pesado.' }
        ];

        let dailyGameId = GAMES[Math.floor(Math.random() * GAMES.length)].id;
        let activeGameCleanup = null;

        window.onload = () => {
            renderMenu();
            renderBadges();
            loadProfileData();
        };

        function renderMenu() {
            const daily = GAMES.find(g => g.id === dailyGameId);
            document.getElementById('daily-game-title').innerText = daily.name;

            const container = document.getElementById('games-list');
            container.innerHTML = '';
            GAMES.forEach(g => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.style.background = '#1e293b';
                btn.style.border = '1px solid #334155';
                btn.style.textAlign = 'left';
                btn.innerText = g.name;
                btn.onclick = () => startGame(g.id, false);
                container.appendChild(btn);
            });
        }

        function renderBadges() {
            const container = document.getElementById('badge-container');
            container.innerHTML = '';
            let unlockedCount = 0;
            state.badges.forEach(b => {
                if (b.unlocked) unlockedCount++;
                const card = document.createElement('div');
                card.className = `badge-card ${b.unlocked ? '' : 'badge-locked'}`;
                card.innerHTML = `<span class="badge-icon">${b.icon}</span><strong>${b.title}</strong><br><span style="font-size:0.7rem; color:var(--text-muted);">${b.desc}</span>`;
                container.appendChild(card);
            });
            document.getElementById('unlocked-count').innerText = unlockedCount;
        }

        function copyClubCode() {
            navigator.clipboard.writeText(state.clubCode);
            alert("Código de Club copiado: " + state.clubCode);
        }

        function saveClub() {
            let name = document.getElementById('club-name-input').value.trim();
            if(!name) {
                name = "Club_Galaxia_" + Math.floor(Math.random() * 8999 + 1000);
                document.getElementById('club-name-input').value = name;
            }
            state.clubName = name;
            unlockBadge('coleccionista');
            alert(`Club gardado: "${name}"`);
        }

        function loadProfileData() {
            let score = state.bestCampaignScore;
            if (typeof score === 'object' && score !== null) score = score.pts || score.score || 0;
            document.getElementById('profile-best-score').innerText = score;
        }

        function unlockBadge(id) {
            const badge = state.badges.find(b => b.id === id);
            if (badge && !badge.unlocked) {
                badge.unlocked = true;
                renderBadges();
            }
        }

        function playDailyGame() { startGame(dailyGameId, false); }

        function startCampaign() {
            state.isCampaign = true;
            state.campaignStep = 0;
            state.campaignTotalScore = 0;
            state.campaignGamesQueue = [...GAMES].sort(() => Math.random() - 0.5).slice(0, 5);
            startGame(state.campaignGamesQueue[0].id, true);
        }

        function startGame(gameId, isCampaign = false) {
            if (activeGameCleanup) { activeGameCleanup(); activeGameCleanup = null; }

            state.isCampaign = isCampaign;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            const campaignInd = document.getElementById('campaign-indicator');
            if (isCampaign) {
                campaignInd.style.display = 'inline-block';
                campaignInd.innerText = `[Campaña ${state.campaignStep + 1}/5]`;
            } else {
                campaignInd.style.display = 'none';
            }

            const game = GAMES.find(g => g.id === gameId);
            document.getElementById('game-title').innerText = game.name;
            document.getElementById('game-desc').innerText = game.desc;

            const stage = document.getElementById('game-stage');
            const controls = document.getElementById('game-controls');
            stage.innerHTML = ''; controls.innerHTML = '';

            switch(gameId) {
                case 'reaccion': runReaccionGame(stage, controls); break;
                case 'tempo': runTempoGame(stage, controls); break;
                case 'dados': runDadosGame(stage, controls); break;
                case 'tiro': runTiroGame(stage, controls); break;
                case 'caixas': runCaixasGame(stage, controls); break;
                case 'memoria': runMemoriaGame(stage, controls); break;
                case 'orde': runOrdeGame(stage, controls); break;
                case 'labirinto': runLabirintoGame(stage, controls); break;
                case 'moscas': runMoscasGame(stage, controls); break;
                case 'sombras': runSombrasGame(stage, controls); break;
                case 'metro': runMetroGame(stage, controls); break;
                case 'stroop': runStroopGame(stage, controls); break;
                case 'parellas': runParellasGame(stage, controls); break;
                case 'simon': runSimonGame(stage, controls); break;
                case 'matematica': runMatematicaGame(stage, controls); break;
                case 'par_impar': runParImparGame(stage, controls); break;
                case 'esquiva': runEsquivaGame(stage, controls); break;
                case 'balanza': runBalanzaGame(stage, controls); break;
            }
        }

        function exitToMenu() {
            if (activeGameCleanup) { activeGameCleanup(); activeGameCleanup = null; }
            document.getElementById('main-menu').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
        }

        function finishGame(score) {
            const normalizedScore = Math.min(1000, Math.max(0, Math.round(score)));
            unlockBadge('vitoria');

            if (state.isCampaign) {
                state.campaignTotalScore += normalizedScore;
                state.campaignStep++;
                if (state.campaignStep < 5) {
                    alert(`Proba superada: ${normalizedScore} pts.\nSiguiente proba de campaña...`);
                    startGame(state.campaignGamesQueue[state.campaignStep].id, true);
                } else {
                    alert(`🎉 CAMPAÑA COMPLETA!\nPuntuación Total: ${state.campaignTotalScore} pts`);
                    unlockBadge('veterano');
                    if (state.campaignTotalScore >= 4000) unlockBadge('perfeccionista');
                    if (state.campaignTotalScore > state.bestCampaignScore) {
                        state.bestCampaignScore = state.campaignTotalScore;
                        loadProfileData();
                    }
                    exitToMenu();
                }
            } else {
                alert(`Xogo rematado! Puntuación obtida: ${normalizedScore} pts`);
                exitToMenu();
            }
        }

        // --- LÓXICA DOS 18 MINIXOGOS ---

        function runReaccionGame(s, c) {
            s.innerHTML = '<p style="color:var(--text-muted);">Agarda polo círculo verde...</p>';
            let timer = setTimeout(() => {
                s.innerHTML = '';
                const circle = document.createElement('div');
                circle.className = 'target-circle';
                const start = Date.now();
                circle.onclick = () => {
                    const diff = Date.now() - start;
                    if (diff < 250) unlockBadge('rapido');
                    finishGame(Math.max(1000 - diff * 1.5, 100));
                };
                s.appendChild(circle);
            }, Math.random() * 2000 + 1500);
            activeGameCleanup = () => clearTimeout(timer);
        }

        function runTempoGame(s, c) {
            s.innerHTML = '<div class="neon-timer" id="timer">0.00s</div>';
            c.innerHTML = '<button class="btn btn-success" id="time-btn">INICIAR</button>';
            let running = false, startTime = 0, timerEvt = null;
            document.getElementById('time-btn').onclick = (e) => {
                if(!running) {
                    running = true; startTime = Date.now(); e.target.innerText = 'PARAR EN 5.00s!';
                    timerEvt = setInterval(() => { document.getElementById('timer').innerText = `${((Date.now() - startTime) / 1000).toFixed(2)}s`; }, 20);
                } else {
                    clearInterval(timerEvt);
                    const finalTime = (Date.now() - startTime) / 1000;
                    const absDiff = Math.abs(5.00 - finalTime);
                    if (absDiff <= 0.1) unlockBadge('mestre_tempo');
                    finishGame(Math.max(1000 - absDiff * 500, 50));
                }
            };
            activeGameCleanup = () => clearInterval(timerEvt);
        }

        function runDadosGame(s, c) {
            const d1 = Math.floor(Math.random() * 6) + 1, d2 = Math.floor(Math.random() * 6) + 1, correct = d1 + d2;
            s.innerHTML = `<div style="font-size:3.5rem;">🎲 ${d1} + 🎲 ${d2}</div>`;
            let opts = [correct, correct + 1, Math.max(2, correct - 1)].sort(() => Math.random() - 0.5);
            c.innerHTML = '<div class="choice-btns"></div>';
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn choice-btn'; btn.innerText = opt;
                btn.onclick = () => finishGame(opt === correct ? 1000 : 200);
                c.querySelector('.choice-btns').appendChild(btn);
            });
        }

        function runTiroGame(s, c) {
            s.style.position = 'relative';
            s.innerHTML = `<div id="target" style="width:40px; height:40px; background:red; border-radius:50%; position:absolute; transform:translate(-50%,-50%);"></div>`;
            c.innerHTML = '<button class="btn btn-danger" id="shoot-btn">🎯 DISPARAR!</button>';
            const target = s.querySelector('#target');
            let shots = 0, totalPts = 0;
            const move = () => { target.style.left = (Math.random()*70+15)+'%'; target.style.top = (Math.random()*60+20)+'%'; };
            move(); const inter = setInterval(move, 450);
            c.querySelector('#shoot-btn').onclick = () => {
                shots++;
                const mark = document.createElement('div'); mark.className = 'shot-mark';
                mark.style.left = target.style.left; mark.style.top = target.style.top; s.appendChild(mark);
                totalPts += 200;
                if(shots >= 5) { clearInterval(inter); finishGame(totalPts); }
            };
            activeGameCleanup = () => clearInterval(inter);
        }

        function runCaixasGame(s, c) {
            const num = Math.floor(Math.random() * 10) + 3;
            s.style.display = 'flex'; s.style.flexWrap = 'wrap'; s.style.gap = '10px';
            for(let i=0; i<num; i++) s.innerHTML += '<div style="font-size:2rem;">📦</div>';
            c.innerHTML = `<input type="number" id="box-in" placeholder="Cantidade?" style="width:100%; padding:10px; margin-bottom:10px; border-radius:4px;"><button class="btn btn-success" id="box-sub">Enviar</button>`;
            c.querySelector('#box-sub').onclick = () => finishGame(parseInt(document.getElementById('box-in').value) === num ? 1000 : 100);
        }

        function runMemoriaGame(s, c) {
            const colors = ['#ef4444', '#22c55e', '#3b82f6'];
            const seq = [colors[Math.floor(Math.random()*3)], colors[Math.floor(Math.random()*3)]];
            s.innerHTML = '<p>Memoriza a secuencia...</p>';
            let i = 0;
            let timer = setInterval(() => {
                if (i < seq.length) {
                    s.innerHTML = `<div style="width:80px; height:80px; border-radius:50%; background:${seq[i]};"></div>`; i++;
                } else {
                    clearInterval(timer);
                    s.innerHTML = '<p>Repite EN ORDE INVERSA!</p>';
                    c.innerHTML = '<div class="choice-btns"></div>';
                    let userSeq = [];
                    colors.forEach(col => {
                        const btn = document.createElement('button'); btn.style.background = col; btn.style.height = '40px'; btn.className = 'btn';
                        btn.onclick = () => {
                            userSeq.push(col);
                            if (userSeq.length === seq.length) {
                                const correct = JSON.stringify(userSeq) === JSON.stringify([...seq].reverse());
                                finishGame(correct ? 1000 : 200);
                            }
                        };
                        c.querySelector('.choice-btns').appendChild(btn);
                    });
                }
            }, 800);
            activeGameCleanup = () => clearInterval(timer);
        }

        function runOrdeGame(s, c) {
            let curr = 1;
            s.innerHTML = '<div class="num-grid" id="ng"></div>';
            [1,2,3,4,5,6].sort(() => Math.random() - 0.5).forEach(n => {
                const b = document.createElement('div'); b.className = 'num-btn'; b.innerText = n;
                b.onclick = () => {
                    if (n === curr) { b.style.opacity = '0.2'; curr++; if (curr > 6) finishGame(1000); }
                };
                s.querySelector('#ng').appendChild(b);
            });
        }

        function runLabirintoGame(s, c) {
            s.innerHTML = '<canvas id="mc" width="300" height="200"></canvas>';
            const cv = document.getElementById('mc'), ctx = cv.getContext('2d');
            ctx.fillStyle = '#22c55e'; ctx.fillRect(10, 80, 40, 40);
            ctx.fillStyle = '#3b82f6'; ctx.fillRect(250, 80, 40, 40);
            ctx.fillStyle = '#ef4444'; ctx.fillRect(120, 0, 60, 150);
            cv.onclick = (e) => {
                const rect = cv.getBoundingClientRect(), x = e.clientX - rect.left;
                if (x > 250) finishGame(1000);
            };
        }

        function runMoscasGame(s, c) {
            s.innerHTML = '<canvas id="fc" width="300" height="200"></canvas>';
            const cv = document.getElementById('fc'), ctx = cv.getContext('2d');
            let flies = [{x: 50, y: 50}, {x: 150, y: 100}, {x: 250, y: 150}];
            const draw = () => {
                ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,300,200);
                ctx.fillStyle = '#f59e0b';
                flies.forEach(f => { ctx.beginPath(); ctx.arc(f.x, f.y, 12, 0, Math.PI*2); ctx.fill(); });
            };
            draw();
            cv.onclick = (e) => {
                const rect = cv.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top;
                flies = flies.filter(f => Math.hypot(f.x - x, f.y - y) > 15);
                draw();
                if (flies.length === 0) finishGame(1000);
            };
        }

        function runSombrasGame(s, c) {
            s.innerHTML = '<div style="font-size:3rem;">🚀</div>';
            c.innerHTML = '<div class="choice-btns"><button class="btn" id="c1">🚀</button><button class="btn" id="c2">🛸</button></div>';
            c.querySelector('#c1').onclick = () => finishGame(1000);
            c.querySelector('#c2').onclick = () => finishGame(200);
        }

        function runMetroGame(s, c) {
            s.innerHTML = '<p>Carreira no Metro!</p><button class="btn btn-success" id="go">Correr</button>';
            s.querySelector('#go').onclick = () => finishGame(850);
        }

        // --- XOGOS 12 A 18 ---
        function runStroopGame(s, c) {
            const colors = [
                { text: 'VERMELLO', color: '#22c55e', correct: 'VERDE' },
                { text: 'AZUL', color: '#ef4444', correct: 'VERMELLO' },
                { text: 'VERDE', color: '#3b82f6', correct: 'AZUL' }
            ];
            const item = colors[Math.floor(Math.random() * colors.length)];
            s.innerHTML = `<h1 style="color:${item.color}; font-size:3rem;">${item.text}</h1><p>Preme A COR DO TEXTO!</p>`;
            c.innerHTML = '<div class="choice-btns"></div>';
            ['VERMELLO', 'VERDE', 'AZUL'].forEach(name => {
                const btn = document.createElement('button'); btn.className = 'btn choice-btn'; btn.innerText = name;
                btn.onclick = () => finishGame(name === item.correct ? 1000 : 200);
                c.querySelector('.choice-btns').appendChild(btn);
            });
        }

        function runParellasGame(s, c) {
            s.innerHTML = '<div class="num-grid" id="cg"></div>';
            const cards = ['🐶', '🐱', '🐶', '🐱'].sort(() => Math.random() - 0.5);
            let flipped = [], matched = 0;
            cards.forEach((emoji, idx) => {
                const card = document.createElement('div'); card.className = 'num-btn'; card.innerText = '❓';
                card.onclick = () => {
                    card.innerText = emoji; flipped.push({ card, emoji });
                    if (flipped.length === 2) {
                        if (flipped[0].emoji === flipped[1].emoji) { matched += 2; flipped = []; if (matched === 4) finishGame(1000); }
                        else { setTimeout(() => { flipped[0].card.innerText = '❓'; flipped[1].card.innerText = '❓'; flipped = []; }, 500); }
                    }
                };
                s.querySelector('#cg').appendChild(card);
            });
        }

        function runSimonGame(s, c) {
            s.innerHTML = '<p style="color:var(--text-muted);">Memoriza o Simón...</p>';
            c.innerHTML = '<button class="btn btn-success" id="s-btn">Repetir Patrón</button>';
            c.querySelector('#s-btn').onclick = () => finishGame(1000);
        }

        function runMatematicaGame(s, c) {
            const n1 = Math.floor(Math.random()*10)+2, n2 = Math.floor(Math.random()*5)+1, res = n1 * n2;
            s.innerHTML = `<div style="font-size:2.5rem;">${n1} × ${n2} = ?</div>`;
            c.innerHTML = '<div class="choice-btns"></div>';
            [res, res + 2, res - 1].sort(() => Math.random() - 0.5).forEach(ans => {
                const btn = document.createElement('button'); btn.className = 'btn choice-btn'; btn.innerText = ans;
                btn.onclick = () => finishGame(ans === res ? 1000 : 100);
                c.querySelector('.choice-btns').appendChild(btn);
            });
        }

        function runParImparGame(s, c) {
            const num = Math.floor(Math.random() * 90) + 10, isEven = num % 2 === 0;
            s.innerHTML = `<div style="font-size:3.5rem; font-weight:bold;">${num}</div>`;
            c.innerHTML = '<div class="choice-btns"><button class="btn choice-btn" id="even">PAR</button><button class="btn choice-btn" id="odd">IMPAR</button></div>';
            c.querySelector('#even').onclick = () => finishGame(isEven ? 1000 : 200);
            c.querySelector('#odd').onclick = () => finishGame(!isEven ? 1000 : 200);
        }

        function runEsquivaGame(s, c) {
            s.innerHTML = '<div style="font-size:2rem; margin-bottom:10px;">🏃 ... 🧱</div>';
            c.innerHTML = '<button class="btn btn-warning" id="jump">SALTAR!</button>';
            c.querySelector('#jump').onclick = () => finishGame(1000);
        }

        function runBalanzaGame(s, c) {
            s.innerHTML = '<div style="font-size:2.5rem;">⚖️ [ 🐘 vs 🐁 ]</div>';
            c.innerHTML = '<div class="choice-btns"><button class="btn choice-btn" id="left">Esquerda 🐘</button><button class="btn choice-btn" id="right">Dereita 🐁</button></div>';
            c.querySelector('#left').onclick = () => finishGame(1000);
            c.querySelector('#right').onclick = () => finishGame(200);
        }
    </script>
</body>
</html>
